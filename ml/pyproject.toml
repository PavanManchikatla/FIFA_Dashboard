[project]
name = "wc26ml"
version = "0.1.0"
description = "WC26 Continental Chaos Board — offline ML pipeline (Elo, Dixon-Coles, Monte Carlo)"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "pyarrow>=17.0",
]

[project.optional-dependencies]
gbm = ["xgboost>=2.1"]
dev = ["pytest>=8.3", "ruff>=0.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wc26ml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
