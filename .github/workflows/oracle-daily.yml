name: oracle-daily

# Retrain ratings + simulate + commit JSON to apps/web/oracle-data/ → Vercel auto-deploys.
# Runtime budget < 10 min on the free runner (PLAN.md §6). The pipeline is implemented
# in Phase 2+; until then the run is a no-op you can trigger manually to validate wiring.

on:
  schedule:
    - cron: '0 6 * * *' # 06:00 UTC daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  oracle:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3

      - name: Ingest latest results
        run: uv run python -m wc26ml.ingest

      - name: Publish oracle artifacts (runs the backtest model card)
        run: uv run python -m wc26ml.publish

      - name: Commit refreshed artifacts
        working-directory: .
        run: |
          if [ -n "$(git status --porcelain apps/web/oracle-data)" ]; then
            git config user.name  "oracle-bot"
            git config user.email "oracle-bot@users.noreply.github.com"
            git add apps/web/oracle-data
            git commit -m "chore(oracle): daily refresh"
            git push
          else
            echo "No oracle changes to commit."
          fi
