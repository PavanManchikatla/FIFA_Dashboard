name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: web (lint · typecheck · test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  ml:
    name: ml (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv run --extra dev pytest
      # Acceptance gate (PLAN.md §4.5): the backtest must accept the model. Exits non-zero
      # if the blended model fails to beat the Elo-only baseline on log-loss in ≥3/4 WCs.
      - name: Backtest acceptance gate
        run: uv run python -m wc26ml.backtest
